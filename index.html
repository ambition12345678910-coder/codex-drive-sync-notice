<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Drive Sync</title><style>body{max-width:760px;margin:64px auto;padding:0 24px;font:17px/1.8 system-ui;color:#243247}a{color:#155ab6}</style><main><h1>Codex Drive Sync</h1><p>用于个人科研计算文件的同步工具，供应用所有者本人使用。</p><p>计算在 Google Colab 中运行。指定批次的结果、日志和断点通过受限 SSH 连接发送到用户自己的服务器，再由 rclone 同步到 Google Drive 中由本应用创建的专用目录。工具不要求每个 Colab 运行时挂载整个 Drive。</p><p>申请的 Google 权限为 <code>drive.file</code>，限于通过该应用使用的特定文件。Google 授权凭据保存在服务器的私有配置中，不传入 Colab，不写入计算结果包。</p><p>这是个人使用的同步工具，不向公众提供账号注册或文件托管服务。</p><p><a href="privacy.html">隐私说明</a></p></main></html>
